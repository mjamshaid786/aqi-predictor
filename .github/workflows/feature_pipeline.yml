name: Hourly Feature Pipeline

on:
  schedule:
    - cron: '25 * * * *'  # Runs every hour, at :25 past the hour
  workflow_dispatch:      # Manual trigger button

jobs:
  run-feature-pipeline:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout Repo
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # feature_pipeline.py now does everything in one script: fetches
      # fresh pollutant + weather data from Open-Meteo (same source as
      # backfill_data.py -- AQICN is no longer used anywhere), computes
      # features, and upserts directly into the Hopsworks feature group.
      # No separate cleaning or upload step is needed anymore.
      - name: Run Feature Pipeline (fetch + upsert to Hopsworks)
        env:
          HOPSWORKS_API_KEY: ${{ secrets.HOPSWORKS_API_KEY }}
          HOPSWORKS_PROJECT: ${{ secrets.HOPSWORKS_PROJECT }}
          HOPSWORKS_HOST: ${{ secrets.HOPSWORKS_HOST }}
        run: python src/feature_pipeline.py